services:
  elus360-landing:
    image: ghcr.io/oaranha/elus360-landing:main
    pull_policy: always
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      PORT: "3000"
      ELUS_LEADS_WEBHOOK_URL: "${ELUS_LEADS_WEBHOOK_URL:-}"
      ELUS_LEADS_WEBHOOK_SECRET: "${ELUS_LEADS_WEBHOOK_SECRET:-}"
      ELUS_WHATSAPP_NUMBER: "${ELUS_WHATSAPP_NUMBER:-}"
    expose:
      - "3000"
    ports:
      - "127.0.0.1:18080:3000"
    networks:
      - vigia-edge
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  vigia-edge:
    external: true
    name: vigia-edge
