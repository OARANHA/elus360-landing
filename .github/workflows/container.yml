name: ELUS360 Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-container:
    name: Testar servidor e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-standalone.mjs
      - run: node --test tests/standalone.test.mjs
      - run: docker build --tag elus360-landing:test .

  publish:
    name: Publicar imagem GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oaranha/elus360-landing:main
            ghcr.io/oaranha/elus360-landing:sha-${{ github.sha }}
      - name: Solicitar redeploy no Portainer (se configurado)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.ELUS360_PORTAINER_WEBHOOK_URL }}
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl --fail --silent --show-error --retry 2 --max-time 20 --request POST "$PORTAINER_WEBHOOK_URL"
